; ============================================================================
; CyberArk platform policy starter - WIN_DSRM_NTDSUTIL
; ============================================================================
; This is a starter policy skeleton. Use your existing CyberArk platform export
; as the authoritative base, then merge the important values below.
;
; Recommended platform behavior:
;   - Enable Change and Reconcile.
;   - Disable real Verify, or configure Verify as a prerequisite-only check.
;   - One account per Domain Controller.
;   - Address = DC hostname/FQDN.
;   - Username = Administrator.
; ============================================================================

PolicyID=WIN_DSRM_NTDSUTIL
PolicyName=Windows DSRM via NTDSUTIL
PolicyType=Regular
ImmediateInterval=5
Interval=1440
MaxConcurrentConnections=1
AllowedSafes=.*

; Password policy - adjust to your domain recovery standard.
PasswordLength=20
MinUpperCase=2
MinLowerCase=2
MinDigit=2
MinSpecial=2
PasswordForbiddenChars="'`\

; Change
AllowManualChange=Yes
PerformPeriodicChange=No
HeadStartInterval=5
FromHour=-1
ToHour=-1

; Verify - true DSRM verification is not safe during normal DC operations.
VFAllowManualVerification=No
VFPerformPeriodicVerification=No
VFVerificationPeriod=30
VFFromHour=-1
VFToHour=-1

; Reconcile
RCAllowManualReconciliation=Yes
RCAutomaticReconcileWhenUnsynched=No
RCFromHour=-1
RCToHour=-1

; CPM custom execution starter values. Merge with your platform export syntax.
ExeName=powershell.exe
XMLFile=No

[ExtraInfo]
ManagementType=Password
PluginName=DSRM_NTDSUTIL
ProcessFile=DSRM_NTDSUTIL_Process.ini
PromptsFile=DSRM_NTDSUTIL_Prompts.ini
WrapperScript=Invoke-DSRMPasswordReset.ps1
TimeoutSeconds=120
UseLocalNullServer=No
