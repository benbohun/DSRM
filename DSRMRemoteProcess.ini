##########################################################################
### PROCESS FILE
### WIN_DSRM_REMOTE - CyberArk TPC starter plugin
### Version v1.20260812.01
###
### Purpose:
###   CyberArk CPM starts this PowerShell wrapper locally. The wrapper opens
###   a PowerShell Remoting / WinRM session to the target DC using the linked
###   LogonAccount (extrapass1), and the target DC runs ntdsutil.exe locally
###   with: reset password on server null
###
### Important:
###   - NTDSUTIL is NOT required on the CPM.
###   - Do not pass credentials or the new DSRM password as command-line args.
###   - TPC sends linked account password and pmnewpass through stdin prompts.
##########################################################################

[states]

StartWrapper=(spawn)PowerShell.exe -NoProfile -ExecutionPolicy Bypass -File bin\\WIN_DSRM_REMOTE\\Invoke-DSRMRemoteReset.ps1 -CyberArkAction "<action>" -TargetServer "<address>" -ExecutionUser "<extrapass1\username>" -Transport "<WinRMTransport>" -Authentication "<WinRMAuthentication>" -Port "<WinRMPort>" -TimeoutSeconds "<TimeoutSeconds>" -EventValidationMode "<EventValidationMode>" -EventLookbackMinutes "<EventLookbackMinutes>" -RemoteNtdsutilPath "<RemoteNtdsutilPath>"
SendExecutionPassword=<pmextrapass1>
SendNewDsrmPassword=<pmnewpass>
FailFromPlugin=FAIL($output_match(buffer), 8110)
FailPowerShell=FAIL($output_match(buffer), 8111)
FailTimeout=FAIL(DSRM remote plugin timed out waiting for wrapper output. Review CPM/TPC logs and wrapper path., 8112)
END=

[transitions]

StartWrapper, InputExecutionPassword, SendExecutionPassword
StartWrapper, PluginFailure, FailFromPlugin
StartWrapper, PowerShellFatal, FailPowerShell

SendExecutionPassword, InputNewPassword, SendNewDsrmPassword
SendExecutionPassword, PluginFailure, FailFromPlugin
SendExecutionPassword, PluginSuccess, END
SendExecutionPassword, PowerShellFatal, FailPowerShell

SendNewDsrmPassword, PluginFailure, FailFromPlugin
SendNewDsrmPassword, PluginSuccess, END
SendNewDsrmPassword, PowerShellFatal, FailPowerShell

[CPM Parameters Validation]

address, source=FILE, Mandatory=yes, AllowCharacters=.-_
username, source=FILE, Mandatory=no, AllowCharacters=.-_\\@
extrapass1\username, source=FILE, Mandatory=yes, AllowCharacters=.-_\\@$
pmextrapass1, source=ENV, Mandatory=yes
pmnewpass, source=ENV, Mandatory=![string equal -nocase "<action>" "logon"]&&![string equal -nocase "<action>" "verifypass"]&&![string equal -nocase "<action>" "prereconcilepass"]
WinRMTransport, source=FILE, Mandatory=no, AllowCharacters=-_
WinRMAuthentication, source=FILE, Mandatory=no, AllowCharacters=-_
WinRMPort, source=FILE, Mandatory=no
TimeoutSeconds, source=FILE, Mandatory=no
EventValidationMode, source=FILE, Mandatory=no
EventLookbackMinutes, source=FILE, Mandatory=no
RemoteNtdsutilPath, source=FILE, Mandatory=no, AllowCharacters=:\\.-_ 

[parameters]

PromptTimeout=240
SendHumanMin=0
SendHumanMax=0
EnableTPCLogonPrompts=yes

[Debug Information]

DebugLogFullParsingInfo=no
DebugLogFullExecutionInfo=no
DebugLogDetailBuiltInActions=no
ExpectLog=no
ConsoleOutput=no
