; ============================================================================
; CyberArk DSRM NTDSUTIL TPC Prompts starter file
; ============================================================================
; Use this only if you choose to drive ntdsutil.exe directly through TPC prompt
; matching instead of using the PowerShell wrapper.
;
; Expected NTDSUTIL prompt flow:
;   ntdsutil:
;   set dsrm password
;   Reset DSRM Administrator Password:
;   reset password on server <DC>
;   Please type password for DS Restore Mode Administrator Account:
;   Please confirm new password:
;   Reset DSRM Administrator Password:
;   quit
;   ntdsutil:
;   quit
;
; Adjust prompt strings to match your OS language/build exactly.
; ============================================================================

[Prompts]
NtdsutilPrompt=ntdsutil:
DsrmPrompt=Reset DSRM Administrator Password:
PasswordPrompt=Please type password for DS Restore Mode Administrator Account:
ConfirmPasswordPrompt=Please confirm new password:
SuccessText=Password has been set successfully
AccessDeniedText=Access is denied
RpcErrorText=The RPC server is unavailable
FailureText=failed

[Responses]
SendSetDsrmPassword=set dsrm password
SendResetRemote=reset password on server {Address}
SendResetLocal=reset password on server null
SendNewPassword={NewPassword}
SendConfirmNewPassword={NewPassword}
SendQuit=quit
