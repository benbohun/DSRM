; ============================================================================
; CyberArk DSRM NTDSUTIL TPC Process starter file
; ============================================================================
; Purpose:
;   Drive NTDSUTIL to reset the Directory Services Restore Mode Administrator
;   password for a target Domain Controller.
;
; IMPORTANT:
;   This file is a starter/template because exact TPC process-file keywords can
;   vary by CyberArk CPM/TPC version and by the customer's existing samples.
;   The recommended production execution is the included PowerShell wrapper:
;       Invoke-DSRMPasswordReset.ps1
;
; Account model:
;   Address  = target DC hostname/FQDN
;   Username = Administrator
;   Password = current vaulted DSRM password
;   NewPassword = CPM-generated password
;
; Change/Reconcile sequence in NTDSUTIL:
;   set dsrm password
;   reset password on server <Address>
;   <NewPassword>
;   <NewPassword>
;   quit
;   quit
;
; Verify:
;   True DSRM verification is not recommended during normal operations because
;   authentication requires booting the DC into Directory Services Restore Mode.
; ============================================================================

[Change]
Command=powershell.exe
Arguments=-NoProfile -ExecutionPolicy Bypass -File "Invoke-DSRMPasswordReset.ps1" -Action Change -TargetServer "{Address}" -NewPassword "{NewPassword}"
Timeout=120

[Reconcile]
Command=powershell.exe
Arguments=-NoProfile -ExecutionPolicy Bypass -File "Invoke-DSRMPasswordReset.ps1" -Action Reconcile -TargetServer "{Address}" -NewPassword "{NewPassword}"
Timeout=120

[Verify]
Command=powershell.exe
Arguments=-NoProfile -ExecutionPolicy Bypass -File "Invoke-DSRMPasswordReset.ps1" -Action Verify -TargetServer "{Address}"
Timeout=60
