; ============================================================================
; CyberArk platform policy starter - WIN_DSRM_REMOTE
; ============================================================================
; Use an exported working Windows/TPC platform as the authoritative base and
; merge these values. This file is intentionally conservative for lab testing.
; ============================================================================

PolicyID=WIN_DSRM_REMOTE
PolicyName=Windows DSRM via Remote NTDSUTIL
PolicyType=Regular
ImmediateInterval=5
Interval=1440
MaxConcurrentConnections=1
AllowedSafes=.*

; Password policy - adjust to match your DSRM recovery standard and any
; password filters installed in the domain. Avoid CR/LF because TPC and
; NTDSUTIL use line-based input.
PasswordLength=24
MinUpperCase=2
MinLowerCase=2
MinDigit=2
MinSpecial=2
PasswordForbiddenChars=

; Change
AllowManualChange=Yes
PerformPeriodicChange=No
HeadStartInterval=5
FromHour=-1
ToHour=-1

; Verify - true DSRM verification requires booting to DSRM, so this plugin
; treats verify/logon/prereconcile as prerequisite checks only.
VFAllowManualVerification=No
VFPerformPeriodicVerification=No
VFVerificationPeriod=30
VFFromHour=-1
VFToHour=-1

; Reconcile
RCAllowManualReconciliation=Yes
RCAutomaticReconcileWhenUnsynched=No
RCFromHour=-1
RCToHour=-1

[ExtraInfo]
ManagementType=Password
PluginName=WIN_DSRM_REMOTE
ProcessFileName=bin/DSRMRemoteProcess.ini
PromptsFileName=bin/DSRMRemotePrompts.ini
WrapperScript=bin/WIN_DSRM_REMOTE/Invoke-DSRMRemoteReset.ps1
WinRMTransport=HTTPS
WinRMAuthentication=Default
WinRMPort=5986
TimeoutSeconds=180
EventValidationMode=Warn
EventLookbackMinutes=10
RemoteNtdsutilPath=C:\Windows\System32\ntdsutil.exe
